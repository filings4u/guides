<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>screenings4u Guide Recorder</title><style>
*{box-sizing:border-box}body{margin:0;width:360px;background:#eef3f8;font:14px Arial,Helvetica,sans-serif;color:#123a6d}.head{background:#153e75;padding:18px 20px;border-bottom:4px solid #ff6500}.head img{width:220px;display:block}.body{padding:18px}.card{background:#fff;border:1px solid #d7e2ef;border-radius:14px;padding:16px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#ff6500;text-transform:uppercase}h1{font-size:20px;margin:7px 0 14px}label{display:block;font-weight:700;font-size:12px;margin:10px 0 6px}input,select{width:100%;height:42px;border:1px solid #cfdbe8;border-radius:8px;padding:0 11px}.btn{width:100%;border:0;border-radius:8px;padding:12px 14px;margin-top:10px;font-weight:800;cursor:pointer}.primary{background:#ff6500;color:white}.secondary{background:#e9f0f8;color:#123a6d}.danger{background:#fff0ed;color:#b52a16}.status{background:#edf3fa;border-radius:9px;padding:11px;margin:10px 0;line-height:1.5}.bad{color:#b42318;background:#fff1f0}.ok{color:#087443}.row{display:flex;gap:8px}.row .btn{flex:1}.account{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;margin-bottom:10px}.linkbtn{border:0;background:#e9f0f8;border-radius:8px;padding:7px 10px;font-weight:700;color:#123a6d}</style></head><body>
<div class="head"><img src="logo2.png" alt="screenings4u Enterprise"></div><div class="body"><div class="card">
<div class="eyebrow">Guide Recorder</div><h1>Click-perfect capture</h1><div id="message" class="status" hidden></div>
<div id="loginView"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="signIn" class="btn primary">Sign In</button></div>
<div id="recorderView" hidden><div class="account"><span id="accountEmail"></span><button id="signOut" class="linkbtn">Sign Out</button></div>
<div id="newGuideView"><label>Guide title</label><input id="title" placeholder="How to Create a Contact"><label>Portal code</label><input id="portal" value="custom"><button id="start" class="btn primary">Start Recording</button></div>
<div id="activeView" hidden><div class="status"><div id="recordingStatus"></div><div id="count"></div><div id="saveStatus"></div></div><button id="stop" class="btn primary">Finish Recording</button><button id="openGuide" class="btn secondary">Open Guide Editor</button><button id="clear" class="btn danger">Start New Guide</button></div>
</div></div><script src="popup.js"></script></body></html>
