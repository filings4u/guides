<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;width:330px;margin:0;color:#12385f;background:#f4f7fb}.wrap{padding:18px}.logo{font-weight:900;font-size:18px;margin-bottom:4px}.sub{font-size:11px;color:#64748b;margin-bottom:16px}.card{background:#fff;border:1px solid #dbe4ef;border-radius:12px;padding:14px}.row{margin:10px 0}label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;border:0;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#f36b00;color:#fff}.secondary{background:#eaf0f7;color:#12385f}.danger{background:#fff0ef;color:#a82418}.status{font-size:12px;padding:10px;background:#eef4fa;border-radius:8px;margin-top:10px}.on{color:#0f8a5f;font-weight:800}
</style></head><body><div class="wrap"><div class="logo">screenings4u</div><div class="sub">GUIDE RECORDER</div><div class="card">
<div id="setup"><div class="row"><label>Guide title</label><input id="title" placeholder="How to create a DOT program"></div><div class="row"><label>Portal</label><select id="portal"><option value="ctpa-dot">C/TPA DOT</option><option value="custom">Other screenings4u portal</option></select></div><button id="start" class="primary">Start Recording</button></div>
<div id="active" hidden><div class="status"><span id="recordingStatus" class="on">● Recording</span><br><span id="count">0 steps captured</span></div><button id="stop" class="secondary">Stop Recording</button><button id="export" class="primary">Export Guide JSON</button><button id="clear" class="danger">Clear Recording</button></div>
<div id="message" class="status" hidden></div></div></div><script src="popup.js"></script></body></html>
