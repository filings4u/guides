<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <style>
    :root {
      --navy: #12385f;
      --orange: #f36b00;
      --muted: #64748b;
      --line: #dbe4ef;
      --soft: #f4f7fb;
      --red: #a82418;
      --green: #0f8a5f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--navy);
      background: var(--soft);
    }

    .wrap {
      padding: 18px;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
    }

    .sub {
      margin-top: 3px;
      margin-bottom: 16px;
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 15px;
    }

    .row {
      margin: 10px 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      color: white;
      background: var(--orange);
    }

    .secondary {
      color: var(--navy);
      background: #eaf0f7;
    }

    .danger {
      color: var(--red);
      background: #fff0ef;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 9px;
      background: #eef4fa;
      font-size: 12px;
      line-height: 1.5;
    }

    .ok {
      color: var(--green);
      font-weight: 800;
    }

    .bad {
      color: var(--red);
      font-weight: 800;
    }

    .account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 11px;
    }

    .account button {
      width: auto;
      margin: 0;
      padding: 6px 8px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="logo">
    screenings4u
  </div>

  <div class="sub">
    GUIDE RECORDER
  </div>

  <div class="card">

    <section id="loginView">

      <div class="row">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
        >

      </div>

      <div class="row">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
        >

      </div>

      <button
        id="signIn"
        class="primary"
      >
        Sign In
      </button>

    </section>

    <section
      id="recorderView"
      hidden
    >

      <div class="account">

        <span id="accountEmail">
        </span>

        <button
          id="signOut"
          class="secondary"
        >
          Sign Out
        </button>

      </div>

      <div id="newGuideView">

        <div class="row">

          <label for="title">
            Guide title
          </label>

          <input
            id="title"
            placeholder="How to create a DOT program"
          >

        </div>

        <div class="row">

          <label for="portal">
            Portal
          </label>

          <select id="portal">

            <option value="ctpa-dot">
              C/TPA DOT
            </option>

            <option value="custom">
              Other screenings4u portal
            </option>

          </select>

        </div>

        <button
          id="start"
          class="primary"
        >
          Start Recording
        </button>

      </div>

      <div
        id="activeView"
        hidden
      >

        <div class="status">

          <span
            id="recordingStatus"
            class="ok"
          >
            ● Recording
          </span>

          <br>

          <span id="count">
            0 steps saved
          </span>

          <br>

          <span id="saveStatus">
            Saved to Guide Builder
          </span>

        </div>

        <button
          id="stop"
          class="secondary"
        >
          Finish Recording
        </button>

        <button
          id="openGuide"
          class="primary"
        >
          Open Guide Editor
        </button>

        <button
          id="clear"
          class="danger"
        >
          Start New Guide
        </button>

      </div>

    </section>

    <div
      id="message"
      class="status"
      hidden
    >
    </div>

  </div>

</div>

<script src="popup.js"></script>

</body>

</html>
